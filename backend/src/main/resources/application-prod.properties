# === BASE DE DONNEES ===
# Tout vient de l'environnement, sans valeur par défaut : une variable absente arrête le
# démarrage avec le nom de la variable manquante. Jamais d'identifiant dans ce fichier.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# Flyway se connecte avec son propre compte : c'est le seul à modifier le schéma.
spring.flyway.user=${DATABASE_MIGRATION_USERNAME}
spring.flyway.password=${DATABASE_MIGRATION_PASSWORD}

# === JPA/HIBERNATE ===
# Desactiver les logs SQL (critique pour les performances)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=200

# === LOGGING MINIMAL EN PRODUCTION ===
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.com.example.siteamame=INFO
# Flyway annonce au démarrage la version du schéma et les migrations appliquées
logging.level.org.flywaydb=INFO

# === SESSIONS ===
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# === JWT (doivent etre definies en variables denvironnement) ===
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# === FRONTEND ===
frontend=${FRONTEND:https://amame.ml}

# === COOKIES ===
cookie.domain=.amame.ml
cookie.secure=true

# === ACTUATOR ===
management.endpoint.health.show-details=never
