# Base de donnees production
spring.datasource.url=jdbc:postgresql://database:5432/amame_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# === OPTIMISATIONS JPA/HIBERNATE ===
# Ne pas modifier le schéma en prod
spring.jpa.hibernate.ddl-auto=update
# Desactiver les logs SQL (critique pour les performances)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Optimisation des requêtes
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=200
# Dialecte PostgreSQL optimisé
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Desactiver les avertissements OSIV (Open Session In View)
spring.jpa.open-in-view=false

# === POOL DE CONNEXIONS OPTIMISÉ (HikariCP) ===
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=10000

# === LOGGING MINIMAL EN PRODUCTION ===
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.com.example.siteamame=INFO

# === SESSIONS ===
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# === JWT (doivent etre definies en variables denvironnement) ===
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# === FRONTEND ===
frontend=${FRONTEND:https://amame.ml}

# === ACTUATOR (monitoring) - optionnel mais recommande ===
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.health.db.enabled=true