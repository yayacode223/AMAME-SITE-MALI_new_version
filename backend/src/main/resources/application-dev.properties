# Base de donnees locale
spring.datasource.url=jdbc:postgresql://localhost:5454/amame_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA en mode developpement (pratique mais moins performant)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pool de connexions leger pour le dev
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Logging detaille pour le developpement
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.siteamame=DEBUG

# JWT en developpement (valeurs par défaut)
jwt.secret=${JWT_SECRET:devSecretKeyForDevelopmentOnly123456789!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend en developpement
frontend=${FRONTEND:http://localhost:5173}