# Base de donnees locale : mêmes variables qu'en production, avec des valeurs par défaut locales
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5454/amame_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.flyway.user=${DATABASE_MIGRATION_USERNAME:${DATABASE_USERNAME:postgres}}
spring.flyway.password=${DATABASE_MIGRATION_PASSWORD:${DATABASE_PASSWORD:postgres}}

# Requêtes SQL visibles en développement. Les valeurs liées ne sont pas journalisées :
# elles contiennent des données personnelles et des empreintes de mots de passe.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging detaille pour le developpement
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.example.siteamame=DEBUG

# JWT en developpement (valeurs par defaut)
jwt.secret=${JWT_SECRET:devSecretKeyForDevelopmentOnly123456789!}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Frontend en developpement
frontend=${FRONTEND:http://localhost:5173}

# Cookies en developpement (pas de domaine, pas de Secure car HTTP)
cookie.domain=
cookie.secure=false

# Afficher les details dans /actuator/health en developpement
management.endpoint.health.show-details=always
