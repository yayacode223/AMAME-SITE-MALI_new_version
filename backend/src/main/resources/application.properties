# Configuration commune à tous les profils.
# Toute valeur d'infrastructure vient d'une variable d'environnement : la liste complète et
# commentée est dans .env.example, à la racine du dépôt.

spring.application.name=siteAmame

# Profil actif (a definir via variable denvironnement)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Compression (utile partout)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# Upload de fichiers (limites communes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ── Base de données ──────────────────────────────────────────────────────────
# L'URL et les identifiants sont lus dans l'environnement (DATABASE_*) : voir le fichier du profil.
#
# Le schéma appartient à Flyway (src/main/resources/db/migration). Hibernate vérifie seulement
# qu'il correspond aux entités et ne le modifie plus jamais : toute évolution du modèle
# s'accompagne d'un script V<n>__<description>.sql.
spring.jpa.hibernate.ddl-auto=validate
# Base existante sans historique Flyway : marquée « en V1 » sans exécuter V1.
# Base vide (tests, nouvelle base) : V1 est exécutée.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.open-in-view=false
# Chargements groupés : une liste de N éléments charge ses fichiers et ses collections
# en une requête (WHERE id IN (...)) au lieu de N.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ── Pool de connexions (HikariCP) ────────────────────────────────────────────
# Deux profils, choisis par variables, sans nouvelle image. Durées en millisecondes.
#   « veille » (défaut, Neon Free) : aucune connexion gardée ouverte, la base peut s'endormir.
#   « toujours actif »             : DB_POOL_MIN_IDLE=2, DB_POOL_IDLE_TIMEOUT=300000,
#                                    DB_POOL_KEEPALIVE_TIME=120000.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:60000}
# 0 = désactivé : un ping périodique empêcherait la base de s'endormir.
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME:0}
# Couvre largement le réveil d'une base endormie.
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=900000
# Auto-commit désactivé : Hibernate n'emprunte une connexion qu'à la première requête SQL.
# Une transaction qui commence par l'envoi d'un fichier n'en occupe donc aucune pendant le transfert.
spring.datasource.hikari.auto-commit=false
# Au-dessus du temps que peut prendre un envoi de fichier : sinon chaque upload lent lève une fausse alerte.
spring.datasource.hikari.leak-detection-threshold=60000

# ── Stockage des fichiers ────────────────────────────────────────────────────
# local : disque (développement, production jusqu'à la bascule, retour arrière).
app.storage.provider=${STORAGE_PROVIDER:local}
# Base des URL publiques, sans « / » final. Vide : URL relatives (/uploads/…).
app.storage.public-base-url=${MEDIA_BASE_URL:}
# Dossier qui contient un sous-dossier par type de contenu (actualite, concours, utilisateur…).
app.storage.local.upload-dir=${UPLOAD_DIR:uploads}
# Purge : supprimer une ligne file_entity inscrit sa clé dans storage_purge_queue (déclencheur de la
# base) ; la tâche de purge efface l'objet après la rétention. Désactivée par défaut, activée en
# production uniquement. La rétention doit dépasser la fenêtre de restauration de la base ; un nombre
# sans unité compte des jours (10 = 10 jours). Même fenêtre de nuit que les autres tâches.
app.storage.purge.enabled=${STORAGE_PURGE_ENABLED:false}
app.storage.purge.retention=${STORAGE_PURGE_RETENTION:10d}
app.storage.purge.schedule=${STORAGE_PURGE_SCHEDULE:0 30 2 * * *}
# Bunny Storage, lu seulement avec STORAGE_PROVIDER=bunny (étape 3) : une zone publique, origine du
# CDN, et une zone privée pour uploads/utilisateur/. Mots de passe d'écriture (« Password » de chaque
# zone), jamais en dur. Le démarrage échoue avec un message explicite s'il en manque un.
app.storage.bunny.endpoint=${BUNNY_STORAGE_ENDPOINT:https://storage.bunnycdn.com}
app.storage.bunny.public-zone.name=${BUNNY_PUBLIC_ZONE:}
app.storage.bunny.public-zone.access-key=${BUNNY_PUBLIC_ZONE_KEY:}
app.storage.bunny.private-zone.name=${BUNNY_PRIVATE_ZONE:}
app.storage.bunny.private-zone.access-key=${BUNNY_PRIVATE_ZONE_KEY:}

# ── Cache des listes publiques ───────────────────────────────────────────────
# 0 = désactivé (défaut). Une durée (10m, 1h…) l'active : les listes publiques sont alors
# servies sans interroger la base, et le cache est vidé à chaque modification par un administrateur.
app.cache.public-lists.ttl=${PUBLIC_LISTS_CACHE_TTL:0}

# ── Tâches planifiées ────────────────────────────────────────────────────────
# Tout ce qui touche la base tourne dans la même fenêtre de nuit, en UTC : la base n'est
# réveillée qu'une fois. Format cron de Spring (seconde minute heure jour mois jour-de-semaine).
app.auth.refresh-token-cleanup-cron=${AUTH_TOKEN_CLEANUP_SCHEDULE:0 30 2 * * *}

# ── Email (SMTP) ─────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Passer à true pour voir les échanges SMTP complets dans les logs (debug seulement)
spring.mail.debug=${MAIL_DEBUG:false}

# Expéditeur et URL site
app.mail.from=${MAIL_FROM:noreply@amame.ml}
app.mail.from-name=AMAME
app.frontend.url=${FRONTEND:https://amame.ml}

# ── Premier administrateur ───────────────────────────────────────────────────
# Créé au démarrage seulement si la table des utilisateurs est vide ET si les deux
# valeurs sont fournies. Vides par défaut : rien n'est créé (cas normal en production).
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ── Actuator ─────────────────────────────────────────────────────────────────
# metrics : lecture ponctuelle du pool (/actuator/metrics/hikaricp.connections.active).
management.endpoints.web.exposure.include=health,info,metrics
# /actuator/health/liveness et /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# Aucune sonde de santé n'interroge la base : une sonde appelée souvent l'empêcherait de s'endormir.
management.health.db.enabled=false
