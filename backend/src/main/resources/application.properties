# Configuration de base
spring.application.name=siteAmame

# Profil actif (a definir via variable denvironnement)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuration commune a tous les environnements
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Compression (utile partout)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# Upload de fichiers (limites communes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Dossier de stockage
file.storage.upload-dir=uploads/

# ── Email (SMTP) ─────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Passer à true pour voir les échanges SMTP complets dans les logs (debug seulement)
spring.mail.debug=${MAIL_DEBUG:false}

# Expéditeur et URL site
app.mail.from=${MAIL_FROM:noreply@amame.ml}
app.mail.from-name=AMAME
app.frontend.url=${FRONTEND:https://amame.ml}
