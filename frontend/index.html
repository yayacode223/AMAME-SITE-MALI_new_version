<!doctype html>
<html lang="fr" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Titre & description ─────────────────────────────────────────────── -->
    <title>AMAME — Association Malienne d'Appui aux Meilleurs Élèves</title>
    <meta
      name="description"
      content="L'AMAME accompagne bénévolement les élèves et étudiants maliens vers l'excellence : bourses d'études, concours, orientation, filières et ressources académiques."
    />
    <meta
      name="keywords"
      content="AMAME, Mali, bourses études, concours Mali, orientation scolaire, filières Mali, étudiants maliens, excellence académique, association Mali"
    />
    <meta name="author" content="AMAME" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://amame.ml/" />

    <!-- ── Theme & PWA ─────────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AMAME" />

    <!-- ── Open Graph ─────────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AMAME" />
    <meta property="og:url" content="https://amame.ml/" />
    <meta property="og:locale" content="fr_ML" />
    <meta
      property="og:title"
      content="AMAME — Association Malienne d'Appui aux Meilleurs Élèves"
    />
    <meta
      property="og:description"
      content="L'AMAME accompagne bénévolement les étudiants maliens : bourses d'études, concours, orientation et ressources académiques. Gratuit et ouvert à tous."
    />
    <meta property="og:image" content="https://amame.ml/amame-uploads/amame-logo.webp" />
    <meta property="og:image:alt" content="Logo AMAME" />
    <meta property="og:image:width" content="400" />
    <meta property="og:image:height" content="400" />

    <!-- ── Twitter Card ───────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@amame_officiel" />
    <meta
      name="twitter:title"
      content="AMAME — Association Malienne d'Appui aux Meilleurs Élèves"
    />
    <meta
      name="twitter:description"
      content="Bourses, concours, orientation et ressources académiques pour les étudiants maliens. 100% gratuit et bénévole."
    />
    <meta name="twitter:image" content="https://amame.ml/amame-uploads/amame-logo.webp" />

    <!-- ── Favicon & Manifest ────────────────────────────────────────────── -->
    <link rel="icon" href="/amame-uploads/amame-logo.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/amame-uploads/amame-logo.webp" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Preconnect fonts (Google Fonts) ───────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

    <!-- ── JSON-LD : Organization ────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AMAME",
      "alternateName": "Association Malienne d'Appui aux Meilleurs Élèves",
      "url": "https://amame.ml",
      "logo": "https://amame.ml/amame-uploads/amame-logo.webp",
      "description": "Association bénévole malienne accompagnant les étudiants vers l'excellence académique grâce à des informations sur les bourses, concours et orientations.",
      "foundingDate": "2023",
      "foundingLocation": {
        "@type": "Place",
        "name": "Bamako, Mali"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "contact@amame.ml",
        "availableLanguage": "French"
      },
      "sameAs": [
        "https://www.facebook.com/amame.mali",
        "https://www.linkedin.com/company/amame-mali",
        "https://twitter.com/amame_officiel"
      ]
    }
    </script>

    <!-- ── JSON-LD : WebSite (SearchAction pour Google) ──────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AMAME",
      "alternateName": "Association Malienne d'Appui aux Meilleurs Élèves",
      "url": "https://amame.ml",
      "description": "Plateforme d'information académique pour les étudiants maliens",
      "inLanguage": "fr",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://amame.ml/articles?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
