  <!-- ── Chargement de page (docs/06, R11) : logo AMAME dans une roue. Affiché par le HTML ci-dessous
       jusqu'au premier rendu de React, puis par <PageLoader> (src/components/PageLoader.tsx, mêmes
       classes) pendant le chargement d'une page. Ses styles sont ici, et non dans index.css, pour être
       là avant toute feuille de style, en développement comme en production. -->
  <style>
    .amame-loader { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: #f9fafb; }
    .amame-loader-section { position: relative; inset: auto; z-index: auto; min-height: 50vh; background: transparent; }
    .amame-loader-mark { position: relative; width: 104px; height: 104px; }
    .amame-loader-section .amame-loader-mark { width: 80px; height: 80px; }
    .amame-loader-ring { position: absolute; inset: 0; box-sizing: border-box; border-radius: 50%; border: 3px solid #dcfce7; border-top-color: #16a34a; animation: amame-loader-spin .9s linear infinite; }
    .amame-loader-logo { position: absolute; inset: 8px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
    .amame-loader-section .amame-loader-logo { inset: 6px; }
    /* 84 % du disque : le logo (bandeau et mains en bas) tient en entier dans le cercle. Le fichier a un
       liseré sombre de 2 px à gauche et de 1 px en haut : clip-path le cache. */
    .amame-loader-logo img { display: block; width: 84%; height: 84%; max-width: none; object-fit: contain; clip-path: inset(1% 1% 1% 1.6%); }
    /* Entre deux pages : rien pendant 200 ms, pour qu'une page déjà en cache ne fasse pas clignoter le logo */
    .amame-loader-delayed .amame-loader-mark { animation: amame-loader-in .2s ease-out .2s both; }
    .amame-loader-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @keyframes amame-loader-spin { to { transform: rotate(360deg); } }
    @keyframes amame-loader-in { from { opacity: 0; } }
    @keyframes amame-loader-pulse { 50% { opacity: .35; } }
    /* Mouvement réduit : la roue ne tourne plus, elle pulse */
    @media (prefers-reduced-motion: reduce) {
      .amame-loader-ring { border-color: #16a34a; animation: amame-loader-pulse 1.6s ease-in-out infinite; }
    }
  </style>

  <!-- ── JSON-LD : Organization ────────────────────────────────────────── -->
