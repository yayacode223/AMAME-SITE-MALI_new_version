# ── Vraie IP du visiteur ────────────────────────────────────────────────────
# Ce conteneur est derrière un proxy frontal (TLS). Sans ces lignes, tous les
# visiteurs auraient l'adresse du proxy et partageraient le même quota.
# Seuls les réseaux privés (proxy sur le même hôte ou le même réseau Docker)
# sont crus : un client direct ne peut pas usurper X-Forwarded-For.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ── Limitation de débit de l'inscription (upload anonyme jusqu'à 10 Mo) ──────
# 5 inscriptions par minute et par adresse, avec une marge de 5 pour les
# réseaux partagés (campus, opérateurs mobiles). Une seule zone pour les deux
# adresses d'inscription : un visiteur a un seul quota, quelle que soit l'adresse.
limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Compression gzip ──────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/rss+xml
    application/ld+json
    image/svg+xml
    font/woff
    font/woff2;

  # ── En-têtes de sécurité globaux ──────────────────────────────────────────
  add_header X-Frame-Options          "SAMEORIGIN"               always;
  add_header X-Content-Type-Options   "nosniff"                  always;
  add_header X-XSS-Protection         "1; mode=block"            always;
  add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

  # ── Configuration d'exécution (URL des médias) ────────────────────────────
  # Réécrite à chaque démarrage du conteneur : jamais mise en cache, sinon un changement
  # de variable dans la stack ne serait pas vu par les navigateurs.
  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ── Assets Vite (cache 1 an — immuables car hash dans le nom) ─────────────
  location /assets/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ── Images statiques ──────────────────────────────────────────────────────
  location /images/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ── CV et photos des inscrits : plus aucun accès public ──────────────────
  # Les deux alias ci-dessous pointent vers /app/uploads/ : les deux chemins
  # sont fermés. Ces fichiers se lisent uniquement par /api/user/files/{id}.
  location ^~ /uploads/utilisateur/ {
    return 404;
  }
  location ^~ /amame-uploads/utilisateur/ {
    return 404;
  }

  # ── Fichiers uploadés par les admins (logo, photos, PDFs) ────────────────
  location /amame-uploads/ {
    alias /app/uploads/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }

  # ── Fichiers uploadés par le backend (concours, filières, partenaires…) ───
  # ^~ : ce préfixe est PRIORITAIRE sur les location regex ci-dessous.
  # Sans ^~, une requête /uploads/xxx.png matcherait le bloc regex `~* \.png$`
  # (qui sert depuis le root par défaut /usr/share/nginx/html) → 404, car les
  # fichiers uploadés vivent dans le volume monté sur /app/uploads/.
  # Contenu choisi au démarrage par 40-runtime-config.sh : servi depuis le disque tant que
  # MEDIA_BASE_URL est vide, sinon redirection permanente vers le CDN (étape 3.5).
  # /uploads/utilisateur/ (bloc plus haut, préfixe plus long) reste en 404 dans les deux cas.
  location ^~ /uploads/ {
    include /etc/nginx/amame/uploads.conf;
  }

  # ── Fichiers statiques racine (favicon, robots, sitemap) ─────────────────
  location ~* \.(ico|png|webp|webmanifest|xml|txt)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # ── Fonts ─────────────────────────────────────────────────────────────────
  location ~* \.(woff|woff2|ttf|eot)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
  }

  # Résolution DNS dynamique — re-résout à chaque requête (TTL 30s)
  # Évite le problème Nginx qui cache l'IP du backend au démarrage et refuse
  # de se reconnecter après un restart du container backend.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # ── Inscription : débit limité par visiteur ──────────────────────────────
  location = /api/visitor/register {
    limit_req zone=register burst=5 nodelay;
    limit_req_status 429;

    set $upstream http://backend:8080;
    proxy_pass $upstream;
    proxy_http_version 1.1;

    client_max_body_size 10M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie            $http_cookie;

    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # ── Inscription + demande d'adhésion (formulaire « Adhérer », le seul du site) ─
  # Chaque inscription envoie un e-mail à chaque SUPERADMIN : sans limite, un robot
  # remplirait la base de faux comptes et épuiserait le quota d'envoi d'e-mails.
  location = /api/visitor/adhesion/register {
    limit_req zone=register burst=5 nodelay;
    limit_req_status 429;

    set $upstream http://backend:8080;
    proxy_pass $upstream;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie            $http_cookie;

    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # ── Fichiers privés (CV, photos des inscrits) ────────────────────────────
  # Servis par le backend après contrôle d'accès. Bloc dédié : le backend fixe
  # lui-même Cache-Control, aucun no-store n'est ajouté ici.
  location ^~ /api/user/files/ {
    set $upstream http://backend:8080;
    proxy_pass $upstream;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie            $http_cookie;

    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;
  }

  # ── Proxy API vers le backend Spring Boot ────────────────────────────────
  location /api/ {
    set $upstream http://backend:8080;
    proxy_pass $upstream;
    proxy_http_version 1.1;

    client_max_body_size 10M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie            $http_cookie;

    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # ── React SPA — renvoie index.html pour toutes les routes frontend ────────
  location / {
    try_files $uri $uri/ /index.html;

    # Pas de cache pour index.html (le SPA doit toujours avoir la dernière version)
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      add_header Pragma "no-cache";
    }
  }
}