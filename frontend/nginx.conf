server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Compression gzip ──────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/rss+xml
    application/ld+json
    image/svg+xml
    font/woff
    font/woff2;

  # ── En-têtes de sécurité globaux ──────────────────────────────────────────
  add_header X-Frame-Options          "SAMEORIGIN"               always;
  add_header X-Content-Type-Options   "nosniff"                  always;
  add_header X-XSS-Protection         "1; mode=block"            always;
  add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

  # ── Assets Vite (cache 1 an — immuables car hash dans le nom) ─────────────
  location /assets/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ── Images statiques ──────────────────────────────────────────────────────
  location /images/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ── Fichiers uploadés par les admins (logo, photos, PDFs) ────────────────
  location /amame-uploads/ {
    alias /app/uploads/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }

  # ── Ancienne route uploads (compatibilité backend) ────────────────────────
  location /uploads/ {
    alias /app/uploads/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }

  # ── Fichiers statiques racine (favicon, robots, sitemap) ─────────────────
  location ~* \.(ico|png|webp|webmanifest|xml|txt)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # ── Fonts ─────────────────────────────────────────────────────────────────
  location ~* \.(woff|woff2|ttf|eot)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
  }

  # Résolution DNS dynamique — re-résout à chaque requête (TTL 30s)
  # Évite le problème Nginx qui cache l'IP du backend au démarrage et refuse
  # de se reconnecter après un restart du container backend.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # ── Proxy API vers le backend Spring Boot ────────────────────────────────
  location /api/ {
    set $upstream http://backend:8080;
    proxy_pass $upstream;
    proxy_http_version 1.1;

    client_max_body_size 10M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie            $http_cookie;

    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # ── React SPA — renvoie index.html pour toutes les routes frontend ────────
  location / {
    try_files $uri $uri/ /index.html;

    # Pas de cache pour index.html (le SPA doit toujours avoir la dernière version)
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      add_header Pragma "no-cache";
    }
  }
}