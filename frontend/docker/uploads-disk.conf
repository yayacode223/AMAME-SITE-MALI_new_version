# /uploads/ servi depuis le disque du serveur : version utilisée tant que MEDIA_BASE_URL est vide.
# Inclus dans « location ^~ /uploads/ » de nginx.conf, par l'intermédiaire de /etc/nginx/amame/uploads.conf,
# que 40-runtime-config.sh réécrit à chaque démarrage.
alias /app/uploads/;
expires 30d;
add_header Cache-Control "public, max-age=2592000";
include /etc/nginx/amame/security-headers.conf;
access_log off;
