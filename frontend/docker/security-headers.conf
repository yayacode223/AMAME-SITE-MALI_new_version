# En-têtes de sécurité de toutes les réponses (docs/06, E4).
# Inclus au niveau « server » ET dans chaque « location » qui pose son propre add_header : Nginx n'hérite
# des add_header du niveau supérieur que si la location n'en pose aucun. Sans cette inclusion, le
# JavaScript, le CSS, les images et les polices étaient servis sans ces en-têtes.
add_header X-Frame-Options          "SAMEORIGIN"               always;
add_header X-Content-Type-Options   "nosniff"                  always;
add_header X-XSS-Protection         "1; mode=block"            always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
