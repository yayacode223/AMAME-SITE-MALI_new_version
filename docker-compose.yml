services:
  database:
    image: postgres:15-alpine
    container_name: amame-database
    environment:
      POSTGRES_DB: amame_db
      POSTGRES_USER: postgres
      # N'est appliqué qu'à la création du volume. Sur une base existante, changer
      # d'abord le mot de passe avec ALTER USER, puis cette variable (voir .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
    networks:
      - common_net
    volumes:
      - database_data:/var/lib/postgresql/data
    restart: unless-stopped
    # ports:
    #   - "5432:5432"  # Ajouté pour accès externe si besoin
    healthcheck: # Ajout d'un healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    #image: yaya236/amame-web-site:backend-v7
    image: yayacode224/amame:${BACKEND_IMAGE_TAG:-backend-v1.7}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amame-backend
    # Pas de port publié : le backend n'est joignable que par Nginx, sur le réseau interne.
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # ── Base de données ─────────────────────────────────────────────────────
      # Tant que la base est sur le VPS, les valeurs par défaut suffisent : le backend se
      # connecte à « database » avec le compte postgres et POSTGRES_PASSWORD.
      # Bascule vers une autre base : renseigner ces cinq variables dans la stack, sans nouvelle image.
      # Le schéma est géré par Flyway (compte DATABASE_MIGRATION_*) ; Hibernate ne le modifie plus.
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://database:5432/amame_db}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-${POSTGRES_PASSWORD}}
      - DATABASE_MIGRATION_USERNAME=${DATABASE_MIGRATION_USERNAME:-postgres}
      - DATABASE_MIGRATION_PASSWORD=${DATABASE_MIGRATION_PASSWORD:-${POSTGRES_PASSWORD}}
      # Pool de connexions : profil « veille » par défaut (voir .env.example pour « toujours actif »)
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-10}
      - DB_POOL_MIN_IDLE=${DB_POOL_MIN_IDLE:-0}
      - DB_POOL_IDLE_TIMEOUT=${DB_POOL_IDLE_TIMEOUT:-60000}
      - DB_POOL_KEEPALIVE_TIME=${DB_POOL_KEEPALIVE_TIME:-0}
      # ── Fichiers ────────────────────────────────────────────────────────────
      # local en développement (DT7). « bunny » et les variables BUNNY_* ne servent qu'en production
      # (deploy/portainer/amamestack.yml) : volontairement absentes de ce fichier.
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      # Même valeur que pour le frontend ci-dessous. Vide : URL relatives (/uploads/…).
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
      # Purge différée des fichiers supprimés : désactivée par défaut, production uniquement.
      - STORAGE_PURGE_ENABLED=${STORAGE_PURGE_ENABLED:-false}
      - STORAGE_PURGE_RETENTION=${STORAGE_PURGE_RETENTION:-10d}
      - STORAGE_PURGE_SCHEDULE=${STORAGE_PURGE_SCHEDULE:-0 30 2 * * *}
      # ── Réveils de la base ──────────────────────────────────────────────────
      - PUBLIC_LISTS_CACHE_TTL=${PUBLIC_LISTS_CACHE_TTL:-0}
      - AUTH_TOKEN_CLEANUP_SCHEDULE=${AUTH_TOKEN_CLEANUP_SCHEDULE:-0 30 2 * * *}
      # ── JWT ─────────────────────────────────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET:?Définir JWT_SECRET (openssl rand -base64 32)}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-900000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - FRONTEND=${FRONTEND:-http://localhost}
      # Cookies — local par défaut : sans domaine + pas de Secure (HTTP)
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Premier administrateur : créé seulement si la table des utilisateurs est vide
      # ET si ces deux variables sont renseignées. À laisser vides en temps normal.
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      # ── Email SMTP ──────────────────────────────────────────────────────────
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:?Définir MAIL_USERNAME dans .env}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?Définir MAIL_PASSWORD dans .env}
      - MAIL_FROM=${MAIL_FROM:?Définir MAIL_FROM dans .env}
      - MAIL_DEBUG=${MAIL_DEBUG:-false}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy # Attend que la base soit prête
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped # Ajouté pour résilience

  frontend:
    #image: yaya236/amame-web-site:frontend-v7
    image: yayacode224/amame:${FRONTEND_IMAGE_TAG:-frontend-v1.21}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amame-frontend
    ports:
      - "80:80"
    networks:
      - common_net
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/app/dist
      - ./backend/uploads:/app/uploads
    environment:
      # Lues au démarrage du conteneur, pas à la construction de l'image : les changer puis
      # mettre la stack à jour suffit. MEDIA_BASE_URL : même valeur que pour le backend.
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
      - MEDIA_OPTIMIZER_ENABLED=${MEDIA_OPTIMIZER_ENABLED:-false}
    restart: unless-stopped

  # Le scraper a quitté cette stack : il se lance à la demande depuis la stack
  # « amame-ops » (ops/docker-compose.yml), plus jamais à chaque déploiement.

  # La supervision (Prometheus, Grafana, postgres-exporter) a été retirée le 4 octobre 2026 :
  # voir docs/03-implementation-migration-neon-bunny.md, écart E14, pour la remettre en place.

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: amame-pgadmin
    ports:
      - "127.0.0.1:5050:80" # accès par tunnel SSH uniquement
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Définir PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy

networks:
  common_net:
    driver: bridge

volumes:
  database_data:
  pgadmin_data:

