services:
  database:
    image: postgres:15-alpine
    container_name: amame-database
    environment:
      POSTGRES_DB: amame_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - common_net
    volumes:
      - database_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"  # Ajouté pour accès externe si besoin
    healthcheck:  # Ajout d'un healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: yaya236/amame-web-site:backend-v2
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: amame-backend
    # ports:
    #   - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/amame_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - JWT_SECRET=ejoVb48DypZtTiMbitoRSVitYSnrICP+ARo1zwg9S/E=
      - JWT_EXPIRATION=2592000000
      - FRONTEND=https://preprod.amame.ml
    # env_file:
    #   - ./backend/.env  # Chemin corrigé
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy  # Attend que la base soit prête
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped  # Ajouté pour résilience

  frontend:
    image: yaya236/amame-web-site:frontend-v2
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amame-frontend
    ports:
      - "80:80"
    networks:
      - common_net
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/app/dist
      - ./backend/uploads:/app/uploads
    environment:
      - VITE_API_URL=
    restart: unless-stopped

  scraper:
    image: yaya236/amame-web-site:scraper-v2
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: amame-scraper
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=amame_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    restart: "no"  # Le scraper ne tourne pas en continu

networks:
  common_net:
    driver: bridge

volumes:
  database_data: