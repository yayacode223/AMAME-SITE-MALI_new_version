services:
  database:
    image: postgres:15-alpine
    container_name: amame-database
    environment:
      POSTGRES_DB: amame_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - common_net
    volumes:
      - database_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"  # Ajouté pour accès externe si besoin
    healthcheck: # Ajout d'un healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: yaya236/amame-web-site:backend-v5
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amame-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/amame_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET:-ejoVb48DypZtTiMbitoRSVitYSnrICP+ARo1zwg9S/E=}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-900000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - FRONTEND=http://localhost
      # Cookies — local : sans domaine + pas de Secure (HTTP)
      - COOKIE_DOMAIN=
      - COOKIE_SECURE=false
      # ── Email SMTP ──────────────────────────────────────────────────────────
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:?Définir MAIL_USERNAME dans .env}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?Définir MAIL_PASSWORD dans .env}
      - MAIL_FROM=${MAIL_FROM:?Définir MAIL_FROM dans .env}
      - MAIL_DEBUG=${MAIL_DEBUG:-false}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy # Attend que la base soit prête
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped # Ajouté pour résilience

  frontend:
    image: yaya236/amame-web-site:frontend-v5
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amame-frontend
    ports:
      - "80:80"
    networks:
      - common_net
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/app/dist
      - ./backend/uploads:/app/uploads
    environment:
      - VITE_API_URL=
    restart: unless-stopped

  scraper:
    image: yaya236/amame-web-site:scraper-v2
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: amame-scraper
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=amame_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    restart: "no" # Le scraper ne tourne pas en continu

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: amame-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpass
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: amame-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@database:5432/amame_db?sslmode=disable"
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: amame-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - common_net
    depends_on:
      - postgres-exporter
      - backend

  grafana:
    image: grafana/grafana-oss:latest
    container_name: amame-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminpass
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - common_net
    depends_on:
      - prometheus

networks:
  common_net:
    driver: bridge

volumes:
  database_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:

