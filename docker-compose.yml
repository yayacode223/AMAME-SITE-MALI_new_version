services:
  database:
    image: postgres:15-alpine
    container_name: amame-database
    environment:
      POSTGRES_DB: amame_db
      POSTGRES_USER: postgres
      # N'est appliqué qu'à la création du volume. Sur une base existante, changer
      # d'abord le mot de passe avec ALTER USER, puis cette variable (voir .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
    networks:
      - common_net
    volumes:
      - database_data:/var/lib/postgresql/data
    restart: unless-stopped
    # ports:
    #   - "5432:5432"  # Ajouté pour accès externe si besoin
    healthcheck: # Ajout d'un healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    #image: yaya236/amame-web-site:backend-v7
    image: yayacode224/amame:${BACKEND_IMAGE_TAG:-backend-v1.1}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amame-backend
    # Pas de port publié : le backend n'est joignable que par Nginx, sur le réseau interne.
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/amame_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET:?Définir JWT_SECRET (openssl rand -base64 32)}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-900000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - FRONTEND=${FRONTEND:-http://localhost}
      # Cookies — local par défaut : sans domaine + pas de Secure (HTTP)
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Premier administrateur : créé seulement si la table des utilisateurs est vide
      # ET si ces deux variables sont renseignées. À laisser vides en temps normal.
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      # ── Email SMTP ──────────────────────────────────────────────────────────
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:?Définir MAIL_USERNAME dans .env}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?Définir MAIL_PASSWORD dans .env}
      - MAIL_FROM=${MAIL_FROM:?Définir MAIL_FROM dans .env}
      - MAIL_DEBUG=${MAIL_DEBUG:-false}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy # Attend que la base soit prête
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped # Ajouté pour résilience

  frontend:
    #image: yaya236/amame-web-site:frontend-v7
    image: yayacode224/amame:${FRONTEND_IMAGE_TAG:-frontend-v1.1}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amame-frontend
    ports:
      - "80:80"
    networks:
      - common_net
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/app/dist
      - ./backend/uploads:/app/uploads
    environment:
      - VITE_API_URL=
    restart: unless-stopped

  # Le scraper a quitté cette stack : il se lance à la demande depuis la stack
  # « amame-ops » (ops/docker-compose.yml), plus jamais à chaque déploiement.

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: amame-pgadmin
    ports:
      - "127.0.0.1:5050:80" # accès par tunnel SSH uniquement
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Définir PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: amame-postgres-exporter
    environment:
      DATA_SOURCE_URI: "database:5432/amame_db?sslmode=disable"
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
    networks:
      - common_net
    depends_on:
      database:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: amame-prometheus
    ports:
      - "127.0.0.1:9090:9090" # accès par tunnel SSH uniquement
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - common_net
    depends_on:
      - postgres-exporter
      - backend

  grafana:
    image: grafana/grafana-oss:latest
    container_name: amame-grafana
    ports:
      - "127.0.0.1:3001:3000" # accès par tunnel SSH uniquement
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # N'est appliqué qu'à la création du volume grafana_data.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Définir GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - common_net
    depends_on:
      - prometheus

networks:
  common_net:
    driver: bridge

volumes:
  database_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:

