# Stack « amame-ops » : sauvegardes planifiées, opérations ponctuelles et scrapers.
#
# Séparée de la stack applicative « amame » : les clés de la zone de sauvegarde
# n'existent qu'ici. Toutes les valeurs viennent des variables de la stack Portainer
# (liste et explications : .env.example à la racine du dépôt, mode d'emploi : ops/README.md).

services:
  backup:
    image: yayacode224/amame:${OPS_IMAGE_TAG:-ops-v1.2.1}
    build:
      context: ./backup
      dockerfile: Dockerfile
      args:
        # Version majeure de la base sauvegardée : 15 sur le VPS, 18 une fois sur Neon
        PG_MAJOR: ${OPS_PG_MAJOR:-15}
    container_name: amame-ops-backup
    environment:
      - BACKUP_DATABASE_URL=${BACKUP_DATABASE_URL:?Définir BACKUP_DATABASE_URL}
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:?Définir BACKUP_PASSPHRASE}
      - BACKUP_DB_SCHEDULE=${BACKUP_DB_SCHEDULE:-02:30 14:30}
      - BACKUP_DB_RETENTION_DAYS=${BACKUP_DB_RETENTION_DAYS:-30}
      - BUNNY_STORAGE_ENDPOINT=${BUNNY_STORAGE_ENDPOINT:-https://storage.bunnycdn.com}
      - BUNNY_BACKUP_ZONE=${BUNNY_BACKUP_ZONE:?Définir BUNNY_BACKUP_ZONE}
      - BUNNY_BACKUP_ZONE_KEY=${BUNNY_BACKUP_ZONE_KEY:?Définir BUNNY_BACKUP_ZONE_KEY}
      # ── Zones de l'application (étape 3) ────────────────────────────────────
      # Noms des zones : copie vers Bunny, réconciliation, sauvegarde depuis Bunny.
      - BUNNY_PUBLIC_ZONE=${BUNNY_PUBLIC_ZONE:-}
      - BUNNY_PRIVATE_ZONE=${BUNNY_PRIVATE_ZONE:-}
      # Mots de passe d'ÉCRITURE (« Password ») : pour copy-to-bunny.sh, pendant la migration
      # seulement. À retirer de cette stack au nettoyage de l'étape 6.
      - BUNNY_PUBLIC_ZONE_KEY=${BUNNY_PUBLIC_ZONE_KEY:-}
      - BUNNY_PRIVATE_ZONE_KEY=${BUNNY_PRIVATE_ZONE_KEY:-}
      # Mots de passe en LECTURE SEULE (« Read-only password ») : réconciliation et sauvegarde.
      - BUNNY_PUBLIC_ZONE_READ_KEY=${BUNNY_PUBLIC_ZONE_READ_KEY:-}
      - BUNNY_PRIVATE_ZONE_READ_KEY=${BUNNY_PRIVATE_ZONE_READ_KEY:-}
      # Source des fichiers sauvegardés : disk jusqu'à la bascule vers Bunny, bunny ensuite.
      - BACKUP_FILES_SOURCE=${BACKUP_FILES_SOURCE:-disk}
    volumes:
      # Dossier RÉEL des uploads de production sur l'hôte, en lecture seule.
      # Chemin à relever dans Portainer (conteneur backend, volumes) : il peut différer du dépôt.
      - ${UPLOADS_HOST_PATH:?Définir UPLOADS_HOST_PATH}:/data/uploads:ro
    tmpfs:
      # Remplace le volume anonyme que l'image postgres déclare et qui ne sert pas ici
      - /var/lib/postgresql/data
    # Serveurs DNS explicites, comme le backend. Les noms des conteneurs restent résolus
    # par le DNS interne de Docker.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - amame    # joindre la base
      - sortie   # joindre Bunny
    restart: unless-stopped

  scraper:
    image: yayacode224/amame:${SCRAPER_IMAGE_TAG:-scraper-v1.1}
    build:
      context: ../scraper
      dockerfile: Dockerfile
    container_name: amame-scraper
    # Reste en veille : un scraper ne s'exécute plus à chaque mise à jour de la stack.
    # Lancement à la demande, depuis la console Portainer du conteneur :
    #   python scraping_site_web_mina7.py
    command: ["sleep", "infinity"]
    environment:
      - DATABASE_URL=${SCRAPER_DATABASE_URL:?Définir SCRAPER_DATABASE_URL}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - amame
      - sortie
    restart: unless-stopped

networks:
  amame:
    # Tant que la base est locale, cette stack rejoint le réseau de la stack « amame »
    # pour joindre le service « database ». Nom à relever avec « docker network ls ».
    external: true
    name: ${AMAME_NETWORK:-amame_common_net}
  # Réseau ordinaire propre à cette stack, pour sortir vers Internet. Inutile en local, mais
  # indispensable en production, où le réseau partagé n'a pas de route vers l'extérieur
  # (14 novembre 2026) ; gardé ici pour que les deux fichiers restent identiques.
  sortie: {}
