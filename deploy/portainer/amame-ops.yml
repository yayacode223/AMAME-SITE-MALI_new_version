# Stack « amame-ops » de PRODUCTION : contenu à coller dans Portainer
# (Stacks → Add stack → nom « amame-ops » → Web editor).
#
# Copie de ops/docker-compose.yml SANS les sections « build » : Portainer tire les images
# publiées sur Docker Hub. Toute modification de l'un se reporte dans l'autre.
# Réseau : common_net, celui de la stack amamestack (relevé le 9 novembre 2026).
#
# Variables et mode d'emploi : ops/README.md. Aucun secret dans ce fichier.
# BACKUP_DATABASE_URL et SCRAPER_DATABASE_URL désignent la base par le nom de son conteneur,
# « amame-database », unique sur l'hôte : common_net est partagé avec d'autres conteneurs.

services:
  backup:
    image: yayacode224/amame:${OPS_IMAGE_TAG:-ops-v1.1}
    container_name: amame-ops-backup
    environment:
      - BACKUP_DATABASE_URL=${BACKUP_DATABASE_URL:?Définir BACKUP_DATABASE_URL}
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:?Définir BACKUP_PASSPHRASE}
      - BACKUP_DB_SCHEDULE=${BACKUP_DB_SCHEDULE:-02:30 14:30}
      - BACKUP_DB_RETENTION_DAYS=${BACKUP_DB_RETENTION_DAYS:-30}
      - BUNNY_STORAGE_ENDPOINT=${BUNNY_STORAGE_ENDPOINT:-https://storage.bunnycdn.com}
      - BUNNY_BACKUP_ZONE=${BUNNY_BACKUP_ZONE:?Définir BUNNY_BACKUP_ZONE}
      - BUNNY_BACKUP_ZONE_KEY=${BUNNY_BACKUP_ZONE_KEY:?Définir BUNNY_BACKUP_ZONE_KEY}
    volumes:
      # Dossier réel des uploads de production sur l'hôte, en lecture seule :
      # le même chemin que UPLOADS_HOST_PATH de la stack amamestack.
      - ${UPLOADS_HOST_PATH:?Définir UPLOADS_HOST_PATH}:/data/uploads:ro
    tmpfs:
      # Remplace le volume anonyme que l'image postgres déclare et qui ne sert pas ici
      - /var/lib/postgresql/data
    # Serveurs DNS explicites, comme le backend. Les noms des conteneurs (amame-database)
    # restent résolus par le DNS interne de Docker.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - amame    # joindre amame-database
      - sortie   # joindre Bunny : common_net ne sort pas vers Internet
    restart: unless-stopped

  scraper:
    image: yayacode224/amame:${SCRAPER_IMAGE_TAG:-scraper-v1.1}
    container_name: amame-scraper
    # Reste en veille. Lancement à la demande, depuis la console Portainer du conteneur :
    #   python scraping_site_web_mina7.py
    command: ["sleep", "infinity"]
    environment:
      - DATABASE_URL=${SCRAPER_DATABASE_URL:?Définir SCRAPER_DATABASE_URL}
    # Les scrapers lisent des sites Internet : mêmes réglages que le service backup
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - amame
      - sortie
    restart: unless-stopped

networks:
  amame:
    external: true
    name: ${AMAME_NETWORK:-common_net}
  # Réseau propre à cette stack (« amame-ops_sortie »), créé par Portainer, ordinaire :
  # c'est par lui que les conteneurs sortent vers Internet. common_net ne donne aucune
  # route vers l'extérieur : « Network unreachable » vers 8.8.8.8 et vers 1.1.1.1:443,
  # constaté le 14 novembre 2026. Un réseau interne ne fournit pas de passerelle : la
  # route par défaut passe donc par celui-ci.
  sortie: {}
